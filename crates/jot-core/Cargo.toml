[package]
name = "jot-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The schema-first workspace engine behind jot-that-down: files, settings, actions, events, index."

[lib]
name = "jot_core"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

blake3 = "1.8"
directories = "6.0.0"
indexmap = { version = "2.14", features = ["serde"] }
# JSON Schema validation of frontmatter (`docs/plans/redesign.md`). Default features off: they pull
# in an HTTP client, and `$ref` is resolved from local files only, by a retriever in `settings.rs`.
jsonschema = { version = "0.63", default-features = false }
markdown = "1.0.0"
# The watcher lives in core: it is an event source for `Action::Sync`, and a surface that grew its
# own would be domain logic on the wrong side of the seam.
notify = "8.0"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2.0.20"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = { workspace = true }
