[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/jot-core", "crates/jot-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/danjolabs/jot-that-down"

[workspace.dependencies]
blake3 = "1.8"
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
directories = "6.0.0"
indexmap = { version = "2.14", features = ["serde"] }
markdown = "1.0.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0.20"
toml = "1.1"
uuid = { version = "1.26", features = ["serde", "v4", "v7"] }
yaml_serde = "0.10.7"

# Surfaces only. None of these may reach `jot-core`
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Dev only.
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.27"
